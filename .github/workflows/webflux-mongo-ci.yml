name: WebFlux MongoDB CI

on:
  push:
    paths:
      - 'spring-boot-webflux-mongodb-examples/**'
      - '.github/workflows/webflux-mongo-ci.yml'
  pull_request:
    paths:
      - 'spring-boot-webflux-mongodb-examples/**'
      - '.github/workflows/webflux-mongo-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-webflux-mongodb-examples

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Run tests
        run: gradle test
