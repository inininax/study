# 호스트 기반 접근 제어 설정 (pg_hba.conf)

# 로컬 접근 (컨테이너 내부)
local   all             all                                     trust

# 특정 IP 대역만 허용하려면 예: 172.18.0.0/16
# host   all             all             172.18.0.0/16           md5

# 모든 외부 IP에서 접근 허용 (보안 이슈 주의)
host    all             all             0.0.0.0/0               md5
