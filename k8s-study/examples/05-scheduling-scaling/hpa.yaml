apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthy-web
  namespace: k8s-study
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthy-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

