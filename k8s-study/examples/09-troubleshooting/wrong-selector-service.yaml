apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-demo
  namespace: k8s-study
  labels:
    app: selector-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-demo
  template:
    metadata:
      labels:
        app: selector-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wrong-selector
  namespace: k8s-study
spec:
  selector:
    app: does-not-match
  ports:
    - name: http
      port: 80
      targetPort: http

