apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-reader
  namespace: k8s-capstone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capstone-reader
  namespace: k8s-capstone
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capstone-reader
  namespace: k8s-capstone
subjects:
  - kind: ServiceAccount
    name: capstone-reader
    namespace: k8s-capstone
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capstone-reader

