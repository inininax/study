global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'milvus-cluster'
    replica: 'primary'

scrape_configs:
  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus:9091']
        labels:
          instance: 'milvus-standalone'

  - job_name: 'etcd'
    static_configs:
      - targets: ['etcd:2379']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'application'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          app: 'milvus-examples'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
