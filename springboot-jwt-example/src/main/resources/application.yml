spring:
  profiles:
    active: localgroup
    group:
      localgroup: localdb, localjpa, localjwt, common, local
      testgroup: localdb, localjpa, localjwt, common, test
---
spring:
  config:
    activate:
      on-profile: localdb
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/jwt
    username: root
    password: 1234
---
spring:
  config:
    activate:
      on-profile: localjpa
  jpa:
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
#        show-sql: true (using System.out)
    properties:
      hibernate:
#        show_sql: true (using System.out)
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
    open-in-view: false # OSIV(Open Session In View)
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 2000
logging:
  level:
    org.hibernate.SQL: debug
#    org.hibernate.type: trace
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
---
spring:
  config:
    activate:
      on-profile: localjwt
jwt:
  header: Authorization
  # fallback은 유효한 Base64(디코딩 69바이트)이며 로컬 개발 전용 — 실제 사용 시 JWT_SECRET 환경변수로 교체
  secret: ${JWT_SECRET:ZGV2LW9ubHktand0LWhtYWMtc2VjcmV0LWZvci1zdHVkeS1yZXBsYWNlLXdpdGgteW91ci1vd24tNjRieXRlLWtleSEh}
  token-validity-in-seconds: 86400 # 86400초 = 60*60*24 = 하루
---
spring:
  config:
    activate:
      on-profile: common
logging:
  level:
    example.jwt: debug
server:
  port: 8080
  tomcat:
    accesslog:
      encoding: UTF-8
---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: test